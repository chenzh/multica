# AI 公司 — 项目台账
# CEO 每周更新。调度脚本 / LangGraph 可读此文件做多 repo 公平队列。
#
# 资产字段（domain、cloudflare_project、sla_hours）为可选，供指挥舱/文档；
# 本机路径与密钥名见 config/repo-paths.local.yaml、company-assets.local.yaml（gitignore）。
# 详见 docs/19-asset-registry.md

company:
  name: your-ai-company
  multica_workspace: default
  timezone: Asia/Shanghai
  github_org: chenzh   # used by ceo-dashboard.sh / portfolio-dispatch (override: GITHUB_ORG)

defaults:
  max_verify_loops: 3
  branch_prefix: cursor/
  labels:
    safe: agent-safe
    running: agent-running
    blocked: agent-blocked
    done: agent-done

projects:
  - id: beatscape
    repo: github.com/chenzh/MusicSaas
    tier: production
    priority: 30
    stack: vite-react-beatscape
    autopilot_id: null
    max_nightly_tickets: 2
    openapi: false
    e2e: true
    paused: false
    delivery_slug: beatscape
    notes: "BeatScape apps/beatscape — MLX/gateway human-only"

  - id: landing-tool-a
    repo: github.com/chenzh/landing-tool-a
    tier: experiment
    priority: 10
    stack: next-static
    autopilot_id: null
    max_nightly_tickets: 2
    openapi: false
    e2e: false
    paused: false
    delivery_slug: landing-tool-a
    notes: "Lightweight landing; scaffold via scripts/ai-company/scaffold-landing.sh"

  - id: saas-stripe-mvp
    repo: github.com/chenzh/saas-stripe-mvp
    tier: staging
    priority: 15
    stack: next-go-saas
    autopilot_id: null
    max_nightly_tickets: 2
    openapi: false
    e2e: false
    paused: false
    delivery_slug: saas-stripe-mvp
    notes: "Payment human-only; repo bootstrapped 2026-08-26"

  - id: json-site
    repo: github.com/chenzh/json-site
    tier: experiment
    priority: 12
    stack: cloudflare-pages
    autopilot_id: null
    max_nightly_tickets: 2
    openapi: false
    e2e: false
    paused: false
    delivery_slug: json-site
    domain: json-site.pages.dev
    cloudflare_project: json-site
    notes: "Feishu site-factory 2026-08-27 — json 格式化"
